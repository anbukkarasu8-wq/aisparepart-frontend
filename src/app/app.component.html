<div class="chat-container">

  <div class="chat-header">

    <div>
      <h1>AI Spare parts</h1>
      <p>Spare Parts Assistant</p>
    </div>

  </div>


  <div class="chat-body">

    <div
      *ngIf="messages.length === 0"
      class="welcome"
    >

      <h2>How can I help you?</h2>

      <p>
        Ask me about vehicle spare parts.
      </p>

      <div class="example">

        <button
          (click)="message='I need brake pads for Hyundai Creta'; sendMessage()"
        >
          Brake pads for Hyundai Creta
        </button>

        <button
          (click)="message='I need an oil filter'; sendMessage()"
        >
          I need an oil filter
        </button>

        <button
          (click)="message='I need clutch parts'; sendMessage()"
        >
          I need clutch parts
        </button>

      </div>

    </div>


    <div
      *ngFor="let item of messages"
      class="message-row"
      [class.user-row]="item.role === 'user'"
      [class.assistant-row]="item.role === 'assistant'"
    >

      <div class="message">

        <div class="role">

          {{
            item.role === 'user'
              ? 'You'
              : 'AI Spare Parts'
          }}

        </div>

        <div class="text">

          {{ item.message }}

        </div>

      </div>

    </div>


    <div
      *ngIf="loading"
      class="message-row assistant-row"
    >

      <div class="message">

        <div class="role">
          AI Spare Parts
        </div>

        <div class="text">
          Thinking...
        </div>

      </div>

    </div>

  </div>


  <div class="chat-input-area">

    <textarea

      [(ngModel)]="message"

      (keydown)="sendOnEnter($event)"

      placeholder="Ask about spare parts..."

      rows="1"

    ></textarea>


    <button

      (click)="sendMessage()"

      [disabled]="loading || !message.trim()"

    >

      Send

    </button>

  </div>

</div>
